name: Gerar e publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Regenera diariamente (o conteudo e versionado; util quando topics.json muda via bot)
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar site
        run: python3 generator.py
      - name: Publicar alteracoes geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: regenerar site [skip ci]"
          git push
